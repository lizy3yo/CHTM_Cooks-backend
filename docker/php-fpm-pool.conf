; Worker pool for the API.
;
; The image default is five workers. Each open realtime stream occupies one for
; up to 30 seconds, so with the default a handful of signed-in users could hold
; every worker and leave ordinary requests queueing behind them.
;
; REALTIME_MAX_STREAMS (config/realtime.php) caps how many workers streams may
; hold; keep it at roughly half of pm.max_children so requests always have room.
; Each worker uses roughly 40-60 MB, so size pm.max_children to the instance's
; memory before raising it.
[www]
pm = dynamic
pm.max_children = 12
pm.start_servers = 3
pm.min_spare_servers = 2
pm.max_spare_servers = 5
; Recycle workers periodically so a slow leak cannot accumulate.
pm.max_requests = 500
