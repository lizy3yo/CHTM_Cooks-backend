; Compile each PHP file once and reuse it, instead of on every request.
; The single largest speed-up available to a Laravel API.
opcache.enable = 1
opcache.memory_consumption = 128
opcache.interned_strings_buffer = 16
opcache.max_accelerated_files = 20000
; The code in the image never changes while the container runs, so there is no
; reason to stat every file on every request. A deploy starts a new container.
opcache.validate_timestamps = 0
opcache.jit = off

; Reuse resolved paths between requests.
realpath_cache_size = 4096K
realpath_cache_ttl = 600
